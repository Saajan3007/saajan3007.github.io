<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2e8d0; --surface: #f9f2e0; --text: #2b2a22; --muted: #6f6a58;
    --accent: #0a7a54; --on-accent: #ffffff; --line: #d9ccaa;
  }
  :root[data-theme="dark"] {
    --bg: #1c1a14; --surface: #26231a; --text: #f1e9d4; --muted: #a8a088;
    --accent: #34d399; --on-accent: #0b2a1f; --line: #3a3627;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, sans-serif; line-height: 1.6;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.25rem; }
  nav { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 0; }
  nav a { color: var(--text); text-decoration: none; margin-right: 1.25rem; }
  nav a:hover { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  #theme {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: .35rem .9rem;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .hero { padding: 4rem 0 3rem; }
  .hero h1 { font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: 1.05; margin: 0 0 1rem; font-weight: 800; }
  .hero p { font-size: 1.2rem; color: var(--muted); max-width: 34rem; margin: 0 0 1.5rem; }
  #role { color: var(--accent); border-right: 3px solid var(--accent); padding-right: 4px; }
  .cta {
    display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none;
    padding: .7rem 1.4rem; border-radius: 8px; font-weight: 600;
  }

  h2 { font-size: 1.6rem; margin: 3rem 0 1rem; }
  .filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .filters button {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: .35rem 1rem; border-radius: 999px;
  }
  .filters button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .project {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.1rem; text-align: left; color: var(--text); width: 100%;
  }
  .project h3 { margin: 0 0 .25rem; }
  .project .tag { font-size: .85rem; color: var(--muted); }
  .project .more { display: none; margin-top: .75rem; }
  .project[aria-expanded="true"] .more { display: block; }
  .project[aria-expanded="true"] { border-color: var(--accent); }
  .more a { color: var(--accent); margin-right: 1rem; }

  .bars div { margin-bottom: .9rem; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s ease; }

  form { display: grid; gap: .75rem; max-width: 460px; }
  input, textarea {
    font: inherit; padding: .65rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text);
  }
  form button { background: var(--accent); color: var(--on-accent); border: 0; padding: .7rem; border-radius: 8px; font-weight: 600; }
  footer { margin: 4rem 0 2rem; color: var(--muted); font-size: .9rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#contact">Contact</a></div>
    <button id="theme" aria-label="Switch light or dark theme">Dark mode</button>
  </nav>

  <header class="hero">
    <h1>Hi, I'm Your Name.</h1>
    <p>I'm a <span id="role"></span> who builds things people actually use.</p>
    <a class="cta" href="#projects">See my work</a>
  </header>

  <section id="projects">
    <h2>Projects</h2>
    <div class="filters" id="filters">
      <button class="on" data-f="all">All</button>
      <button data-f="web">Web</button>
      <button data-f="data">Data</button>
      <button data-f="app">Apps</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="skills">
    <h2>Skills</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <form id="form">
      <input id="name" placeholder="Your name" required>
      <input id="email" type="email" placeholder="Your email" required>
      <textarea id="msg" rows="4" placeholder="Your message" required></textarea>
      <button type="submit">Send message</button>
      <small id="status" role="status"></small>
    </form>
  </section>

  <footer>© <span id="year"></span> Your Name · <a href="https://github.com/yourusername" style="color:inherit">GitHub</a></footer>
</div>

<script>
  // ===== EDIT THIS SECTION =====
  const MY_EMAIL = "you@email.com";
  const ROLES = ["web developer", "designer", "problem solver"];
  const PROJECTS = [
    { title: "Weather App", type: "web", desc: "Shows live weather for any city.", live: "#", code: "https://github.com/yourusername/weather-app" },
    { title: "Sales Dashboard", type: "data", desc: "Charts and insights from sales data.", live: "#", code: "https://github.com/yourusername/sales-dashboard" },
    { title: "Task Manager", type: "app", desc: "A simple to-do app with reminders.", live: "#", code: "https://github.com/yourusername/task-manager" },
    { title: "Portfolio Site", type: "web", desc: "This very page, hosted on GitHub Pages.", live: "#", code: "https://github.com/yourusername/yourusername.github.io" }
  ];
  const SKILLS = { "HTML & CSS": 90, "JavaScript": 75, "Python": 65, "Git & GitHub": 80 };
  // =============================

  // Theme toggle (remembers choice)
  const root = document.documentElement, themeBtn = document.getElementById("theme");
  function setTheme(t) {
    root.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light mode" : "Dark mode";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  themeBtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

  // Typing role effect
  const roleEl = document.getElementById("role");
  let ri = 0, ci = 0, del = false;
  (function type() {
    const w = ROLES[ri];
    roleEl.textContent = w.slice(0, ci);
    if (!del && ci++ === w.length) { del = true; return setTimeout(type, 1400); }
    if (del && --ci === 0) { del = false; ri = (ri + 1) % ROLES.length; }
    setTimeout(type, del ? 40 : 90);
  })();

  // Projects: filter + expand on click
  const grid = document.getElementById("grid");
  function render(f) {
    grid.innerHTML = "";
    PROJECTS.filter(p => f === "all" || p.type === f).forEach(p => {
      const b = document.createElement("button");
      b.className = "project"; b.setAttribute("aria-expanded", "false");
      b.innerHTML = `<h3>${p.title}</h3><span class="tag">${p.type}</span>
        <div class="more"><p>${p.desc}</p><a href="${p.live}">Live demo</a><a href="${p.code}">Code</a></div>`;
      b.onclick = e => {
        if (e.target.tagName === "A") return;
        b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") === "true" ? "false" : "true");
      };
      grid.appendChild(b);
    });
  }
  render("all");
  document.getElementById("filters").onclick = e => {
    if (e.target.dataset.f === undefined) return;
    document.querySelectorAll("#filters button").forEach(x => x.classList.remove("on"));
    e.target.classList.add("on"); render(e.target.dataset.f);
  };

  // Skill bars animate when scrolled into view
  const bars = document.getElementById("bars");
  bars.innerHTML = Object.entries(SKILLS).map(([k, v]) =>
    `<div><span>${k}</span><div class="bar"><i data-w="${v}"></i></div></div>`).join("");
  new IntersectionObserver((es, o) => es.forEach(e => {
    if (e.isIntersecting) { bars.querySelectorAll("i").forEach(i => i.style.width = i.dataset.w + "%"); o.disconnect(); }
  })).observe(bars);

  // Contact form opens the visitor's email app
  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const n = document.getElementById("name").value, em = document.getElementById("email").value, m = document.getElementById("msg").value;
    location.href = `mailto:${MY_EMAIL}?subject=${encodeURIComponent("Portfolio message from " + n)}&body=${encodeURIComponent(m + "\n\nReply to: " + em)}`;
    document.getElementById("status").textContent = "Opening your email app…";
  };

  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
